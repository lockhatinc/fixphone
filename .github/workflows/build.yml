name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pyinstaller

      - name: Run tests
        run: pytest -q

      - name: Build exe
        run: pyinstaller --clean fixphone.spec

      - name: Smoke test exe (drag-and-drop arg form)
        shell: pwsh
        run: |
          @"
          Name,Mobile
          Alice,082 123 4567
          Bob,082 123 456
          "@ | Set-Content -Encoding utf8 sample.csv
          # Exit code 1 expected (one busted number)
          $p = Start-Process -FilePath .\dist\fixphone.exe -ArgumentList 'sample.csv' -NoNewWindow -Wait -PassThru -RedirectStandardInput NUL
          if ($p.ExitCode -ne 1) { Write-Error "expected exit 1, got $($p.ExitCode)"; exit 1 }
          Write-Host "smoke test passed (exit=1 as expected)"

      - uses: actions/upload-artifact@v4
        with:
          name: fixphone-windows-x64
          path: dist/fixphone.exe
          if-no-files-found: error

      # Rolling "latest" release on every push to main.
      - name: Publish rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest (main)
          body: |
            Auto-built from `main` (commit ${{ github.sha }}).
            Download `fixphone.exe` below — drag a `.csv` or `.xlsx` onto it, or use Send-To.
          files: dist/fixphone.exe
          prerelease: true
          make_latest: false

      # Versioned release on tag push.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fixphone.exe
          generate_release_notes: true
          make_latest: true
